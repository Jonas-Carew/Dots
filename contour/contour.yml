
default_profile: main

profiles:
    main:
        shell: /bedrock/cross/bin/fish
        arguments: [ "-c", "tmux" ]
        initial_working_directory: "/home/jonasc/Desktop/Desktop/"
        show_title_bar: false
        size_indicator_on_resize: false
        momentum_scrolling: false
        mouse:
            hide_while_typing: true
        font:
            size: 10
            regular:
                family: "FiracodeNerdFont"
        screen_transition: classic
        background:
            opacity: 0.9
        status_line:
            display: none
        colors: "default"

color_schemes:
    default:
        default:
            background: "#23272e"
            foreground: "#abb2bf"
        cursor:
            default: "#4cd1e0"
            text: "#616e5d"
        selection:
            background: "#434956"
            foreground: "#abb2bf"
        normal:
            black: "#3f4451"
            red: "#bd0013"
            green: "#4ab118"
            yellow: "#e7741e"
            blue: "#008df8"
            magenta: "#c224c3"
            cyan: "#24bac3"
            white: "#f8dcc0"
        bright:
            black: "#4f5666"
            red: "#ff616e"
            green: "#a5e075"
            yellow: "#efc11a"
            blue: "#4dc4ff"
            magenta: "#de73ff"
            cyan: "#4cd1e0"
            white: "#e6e6e6"

input_mapping:
